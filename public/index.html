<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poultry Manager</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="screen"><div class="card login"><h1>🐔 Poultry Manager</h1><p>Broiler Farm Management</p><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><small>Owner: owner@poultry.local / Owner@123</small></div></div><div id="app" class="hidden"><header><b>🐔 Poultry Manager</b><span id="role"></span><button onclick="logout()">Logout</button></header><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('daily')">Daily Entry</button><button onclick="show('batches')">Batches</button><button id="usersBtn" onclick="show('users')">Owner / Users</button></nav><main><section id="dashboard"><h2>Farm Dashboard</h2><select id="dashBatch" onchange="report(this.value)"></select><div id="stats" class="grid"></div></section><section id="daily" class="hidden"><h2>Daily Data Entry</h2><form onsubmit="daily(event)" class="card form"><select id="dBatch"></select><input id="date" type="date" required><input id="feed" type="number" step=".01" placeholder="Feed kg"><input id="dead" type="number" placeholder="Dead birds / mortality"><input id="weight" type="number" step=".01" placeholder="Today's total weight kg"><input id="med" type="number" step=".01" placeholder="Medicine expense"><input id="other" type="number" step=".01" placeholder="Other expense"><textarea id="notes" placeholder="Notes"></textarea><button>Save Daily Entry</button></form></section><section id="batches" class="hidden"><h2>Batch Management</h2><form onsubmit="batch(event)" class="card form"><input id="bn" placeholder="Batch name" required><input id="bd" type="date" required><input id="bc" type="number" placeholder="Chicks quantity" required><input id="br" type="number" step=".01" placeholder="Chick rate"><input id="sr" type="number" step=".01" placeholder="Sale rate / kg"><button>Create Batch</button></form><div id="bl"></div></section><section id="users" class="hidden"><h2>Owner Command Center</h2><form onsubmit="user(event)" class="card form"><input id="un" placeholder="User name" required><input id="ue" type="email" placeholder="Email" required><input id="up" placeholder="Password" required><select id="ur"><option value="worker">Worker</option><option value="manager">Manager</option></select><button>Add User</button></form><div id="ul"></div></section></main></div><script src="app.js"></script></body></html>
